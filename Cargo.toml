[package]
name = "rayo"
version = "0.2.0"
edition = "2024"
description = "Fast Windows terminal with command blocks, written in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26"
arboard = "3.7.0"
base64 = "0.23"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "accesskit"] }
egui = "0.37"
png = "0.18"
polling = "3.11"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Globalization"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3"
