name: ci

on:
  # PRs run once (pull_request); pushes only for main, so a PR branch isn't tested twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # ponytail: Windows only until the Unix port exists (ConPTY, Job Objects, creation_flags).
        # Add ubuntu-latest / macos-latest back then. Keep the matrix: branch protection requires
        # the check named "test (windows-latest)".
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
