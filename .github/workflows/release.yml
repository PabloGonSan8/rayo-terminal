name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance attestation (`gh attestation verify rayo.exe -R PabloGonSan8/rayo-terminal`).
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The app compares its own version with the tag: a mismatch would offer the update forever.
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
       - run: cargo build --release --locked
        # The in-app updater refuses a release without this file; install.ps1 and WinGet use it too.
        - name: SHA-256
          shell: pwsh
          run: |
            $h = (Get-FileHash target/release/rayo.exe -Algorithm SHA256).Hash.ToLower()
            "$h  rayo.exe" | Out-File -Encoding ascii -NoNewline target/release/rayo.exe.sha256
            Get-Content target/release/rayo.exe.sha256
        - uses: actions/attest-build-provenance@v2
          with:
            subject-path: target/release/rayo.exe
        - uses: softprops/action-gh-release@v3
        with:
          # Keep the asset name "rayo.exe": install.ps1, the in-app updater and the website
          # (download_count) all depend on it.
          files: |
            target/release/rayo.exe
            target/release/rayo.exe.sha256
          generate_release_notes: true
