name: Bug report / Error
description: Something doesn't work / Algo no funciona
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / ¿Qué pasó?
      description: Include what you expected / Incluye qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      placeholder: |
        1. Open Rayo
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rayo version / Versión de Rayo
      placeholder: v0.1.0
  - type: input
    id: os
    attributes:
      label: Windows version / Versión de Windows
      placeholder: Windows 11 24H2
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: pwsh 7.5 / Windows PowerShell / cmd / WSL
  - type: textarea
    id: crash
    attributes:
      label: Crash log (if Rayo closed by itself) / Registro de fallo (si Rayo se cerró solo)
      description: |
        Last entry of %APPDATA%\rayo\crash.log. Check it doesn't contain anything private.
        Última entrada de %APPDATA%\rayo\crash.log. Revisa que no tenga nada privado.
      render: text
